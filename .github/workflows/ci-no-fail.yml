name: Non-failing CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Build (no-fail)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Try Maven build (non-failing)
        if: always()
        run: |
          if [ -f pom.xml ]; then
            echo "Found pom.xml — attempting mvn package (skip tests)"
            mvn -B -DskipTests package || echo "mvn failed but continuing"
          else
            echo "No pom.xml found"
          fi
        continue-on-error: true

      - name: Try Gradle build (non-failing)
        if: always()
        run: |
          if [ -f gradlew ]; then
            ./gradlew build -x test || echo "gradlew failed but continuing"
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "Found build.gradle — attempting gradle build"
            gradle build -x test || echo "gradle failed but continuing"
          else
            echo "No Gradle build files found"
          fi
        continue-on-error: true

      - name: Optional Java compile check (non-failing)
        if: always()
        run: |
          if [ -d src/main/java ]; then
            echo "Compiling Java sources for quick sanity check"
            find src/main/java -name '*.java' > /tmp/java_files || true
            if [ -s /tmp/java_files ]; then
              javac -d /tmp/classes $(cat /tmp/java_files) || echo "javac failed but continuing"
            else
              echo "No Java source files found"
            fi
          else
            echo "No src/main/java directory"
          fi
        continue-on-error: true

      - name: Configuration scan (non-failing)
        if: always()
        run: |
          echo "Scanning for configuration files"
          ls -1 appsettings.json application.yml application.yaml application.properties pom.xml build.gradle build.gradle.kts || true
        continue-on-error: true

      - name: Finalize (force success)
        if: always()
        run: |
          echo "Non-failing workflow completed"
          exit 0
